# Text-to-SQL: ClickHouse + app Streamlit.
#
#   docker compose up -d --build          # chạy, mở http://localhost:8501 (chọn Database trong sidebar)
#   docker compose exec app python evaluate.py --configs all      # chấm điểm trên database mặc định
#   docker compose down                   # dừng (giữ dữ liệu);  down -v để xóa luôn dữ liệu
#
# Cấu hình lấy từ file .env (xem .env.example): LLM_*, T2SQL_*, CLICKHOUSE_PASSWORD, T2SQL_CH_PASSWORD.
# Dữ liệu demo (database einvoice, ~100 triệu dòng) sinh riêng bằng: python datasets/einvoice/generate.py
# Muốn dùng ClickHouse có sẵn của công ty: đặt T2SQL_DATABASE_URL_DOCKER trong .env trỏ tới đó, áp dụng
# docker/clickhouse/sql/03_access.sql (sửa tên database / bảng / cột) rồi chỉ chạy `docker compose up -d --build app`.

name: text-to-sql

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Đặt CLICKHOUSE_PASSWORD trong .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1     # cho user quản trị tạo user/role bằng SQL
      T2SQL_CH_PASSWORD: ${T2SQL_CH_PASSWORD:?Đặt T2SQL_CH_PASSWORD trong .env}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - chdata:/var/lib/clickhouse
      # Chỉ chạy khi thư mục dữ liệu còn trống (lần đầu). Đổi dữ liệu mẫu: docker compose down -v
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./docker/clickhouse/sql:/t2sql/sql:ro
      - ./docker/clickhouse/config.d/t2sql.xml:/etc/clickhouse-server/config.d/t2sql.xml:ro
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"   # HTTP interface, chỉ mở cho máy local
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}   # giờ trong log / kết quả đánh giá
      # Ghi đè URL trong .env: bên trong mạng Docker, ClickHouse có tên host là "clickhouse".
      T2SQL_DATABASE_URL: ${T2SQL_DATABASE_URL_DOCKER:-clickhouse://t2sql:${T2SQL_CH_PASSWORD:-}@clickhouse:8123/einvoice}
      # Database chọn trong sidebar của app (thêm database khác: đặt thêm biến T2SQL_DATABASE_URL_<TÊN>).
      T2SQL_DATABASE_URL_EINVOICE: clickhouse://t2sql:${T2SQL_CH_PASSWORD:-}@clickhouse:8123/einvoice
    ports:
      - "${APP_PORT:-8501}:8501"
    volumes:
      - ./logs:/app/logs          # log truy vấn + phản hồi người dùng
      - ./results:/app/results    # kết quả evaluate.py
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  chdata:
