# Text-to-SQL: app Streamlit nối tới ClickHouse của công ty (database hddt). ClickHouse cục bộ chỉ là tùy chọn (profile "demo").
#
#   docker compose up -d --build app      # chạy, mở http://localhost:8501 (chọn Database trong sidebar)
#   docker compose exec app python evaluate.py --configs all      # chấm điểm trên database mặc định
#   docker compose down                   # dừng (giữ dữ liệu);  down -v để xóa luôn dữ liệu
#
# Cấu hình lấy từ file .env (xem .env.example): LLM_*, T2SQL_*, CLICKHOUSE_PASSWORD, T2SQL_CH_PASSWORD.
# App lấy URL từ T2SQL_DATABASE_URL_DOCKER, nếu trống thì dùng T2SQL_DATABASE_URL_CONGTY (xem .env.example).
# ClickHouse cục bộ (chỉ cần khi muốn chạy lại bộ test đầy đủ với database giả lập einvoice):
#   docker compose --profile demo up -d clickhouse && python datasets/einvoice/generate.py

name: text-to-sql

services:
  clickhouse:
    profiles: ["demo"]          # không chạy mặc định: dữ liệu thật nằm ở ClickHouse của công ty
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Đặt CLICKHOUSE_PASSWORD trong .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1     # cho user quản trị tạo user/role bằng SQL
      T2SQL_CH_PASSWORD: ${T2SQL_CH_PASSWORD:?Đặt T2SQL_CH_PASSWORD trong .env}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - chdata:/var/lib/clickhouse
      # Chỉ chạy khi thư mục dữ liệu còn trống (lần đầu). Đổi dữ liệu mẫu: docker compose down -v
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./docker/clickhouse/sql:/t2sql/sql:ro
      - ./docker/clickhouse/config.d/t2sql.xml:/etc/clickhouse-server/config.d/t2sql.xml:ro
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"   # HTTP interface, chỉ mở cho máy local
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}   # giờ trong log / kết quả đánh giá
      # Database mặc định của app (thêm database khác vào sidebar: đặt thêm biến T2SQL_DATABASE_URL_<TÊN>).
      T2SQL_DATABASE_URL: ${T2SQL_DATABASE_URL_DOCKER:-${T2SQL_DATABASE_URL_CONGTY:?Đặt T2SQL_DATABASE_URL_CONGTY (hoặc T2SQL_DATABASE_URL_DOCKER) trong .env}}
    ports:
      - "${APP_PORT:-8501}:8501"
    volumes:
      - ./logs:/app/logs          # log truy vấn + phản hồi người dùng
      - ./results:/app/results    # kết quả evaluate.py

volumes:
  chdata:
